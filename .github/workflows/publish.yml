# Publish ehf-helper to npm.
#
# This workflow NEVER runs on push or pull_request — it only runs when the
# repository owner creates a GitHub release ("Releases" -> "Draft a new
# release" -> "Publish release"). Publishing needs the owner's npm account:
# before the first release, the owner must add an npm access token as the
# repository secret NPM_TOKEN (npmjs.com -> Access Tokens -> "Granular Access
# Token" scoped to this package, or the classic "Automation" token).
# Contributors cannot trigger a publish; there is nothing to configure in a
# fork or worktree.
#
# The job runs the full test suite first and publishes only if it passes.

name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: node --test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
